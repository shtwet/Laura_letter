<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <section class="cssletter">
    <div class="envelope">
      <button class="heart" id="openEnvelope" aria-label="Open Envelope">
        <span class="heart-text">Open</span>

      <div class="envelope-flap"></div>
      <div class="envelope-folds">
        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-bottom"></div>
      </div>
      <blockquote class="letter center" id="letter1" tabindex="0">
         <p style="font-size: 1.5rem; color: darkred; text-align: center;">˚ʚ❤︎ɞ˚</p>
         <p></p>Ois Guade zum Geburtstag Laura! <br>I wünsch da wirklich ois Guade zum Geburtstag und bitte bleib so wie du bist weil du bist in meine Augen wirklich perfekt!<br><br>I lieb di Laura</p>
         <cite>~Jakob</cite>
        
      </blockquote>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
